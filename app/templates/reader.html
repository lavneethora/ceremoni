<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceremoni Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/reader.css?v={{ static_version }}">
</head>
<body class="reader-body">
    <header class="reader-header">
        <h1>ceremoni <span class="reader-tag">reader</span></h1>
        <div class="header-right">
            <span class="user-name">{{ user.name }}</span>
            <a href="/admin/dashboard" class="btn btn-small">Dashboard</a>
            <a href="/admin/logout" class="btn btn-small">Logout</a>
        </div>
    </header>

    <main class="reader-main">
        <div class="reader-controls">
            <select id="session-select">
                <option value="">Select session</option>
            </select>
            <div class="reader-modes" id="reader-modes" hidden>
                <button type="button" class="reader-mode active" data-mode="scan">Scan cards</button>
                <button type="button" class="reader-mode" data-mode="queue">Play next</button>
            </div>
        </div>

        <section class="reader-scan" id="reader-scan" hidden>
            <div class="reader-scan-start" id="scan-start">
                <p>The camera reads each student's card and plays their announcement.</p>
                <button class="reader-play-btn" id="scan-start-btn" type="button">Start scanning</button>
            </div>

            <div class="reader-scan-live" id="scan-live" hidden>
                <div class="reader-scan-video">
                    <video id="scan-video" playsinline muted></video>
                    <div class="reader-scan-reticle"></div>
                </div>

                <div class="reader-scan-current" id="scan-current" hidden>
                    <div class="reader-current-label" id="scan-position"></div>
                    <div class="reader-current-name" id="scan-name"></div>
                    <div class="reader-current-meta" id="scan-meta"></div>
                </div>

                <div class="reader-notice" id="scan-notice" hidden></div>

                <div class="reader-scan-foot">
                    <span id="scan-count"></span>
                    <button class="btn btn-small" id="scan-stop-btn" type="button">Stop camera</button>
                </div>

                <ol class="reader-upcoming-list" id="scan-recent"></ol>
            </div>
        </section>

        <section class="reader-stage" id="reader-stage" hidden>
            <div class="reader-current" id="reader-current">
                <div class="reader-current-label">Now announcing</div>
                <div class="reader-current-name" id="reader-current-name">Ready</div>
                <div class="reader-current-meta" id="reader-current-meta"></div>
            </div>

            <button class="reader-play-btn" id="reader-play-btn" type="button" disabled>Play Next</button>
            <button class="reader-back-btn" id="reader-back-btn" type="button" disabled>Back</button>
            <div class="reader-hint">Or press <kbd>Space</kbd></div>
            <div class="reader-notice" id="reader-notice" hidden></div>

            <div class="reader-upcoming">
                <div class="reader-upcoming-label">Up next</div>
                <ol class="reader-upcoming-list" id="reader-upcoming-list"></ol>
            </div>
        </section>

        <div class="reader-empty" id="reader-empty">Pick a session to begin.</div>

        <audio id="reader-audio" preload="auto"></audio>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
            integrity="sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx"
            crossorigin="anonymous"></script>
    <script src="/static/reader.js?v={{ static_version }}"></script>
</body>
</html>
