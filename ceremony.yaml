# Ceremoni — Ceremony Configuration
# Edit this file to set up graduation events, sessions, and college walk order.
# After editing, restart the server or hit the "Reload Config" button.

events:
  # active: false keeps a ceremony's data and history but takes it out of the
  # session pickers, so last year's events stop cluttering the live ones.
  - name: Spring 2026 Undergraduate
    active: false
    sessions:
      - label: "Friday 9:00 AM"
        date: "2026-05-15"
        time: "9:00 AM"
        colleges:
          - College of Arts & Sciences

      - label: "Friday 1:30 PM"
        date: "2026-05-15"
        time: "1:30 PM"
        colleges:
          - College of Education
          - College of Health & Human Sciences
          - Edward E. Whitacre Jr. College of Engineering

      - label: "Saturday 9:00 AM"
        date: "2026-05-16"
        time: "9:00 AM"
        colleges:
          - Honors College
          - J.T. & Margaret Talkington College of Visual & Performing Arts
          - Jerry S. Rawls College of Business Administration

      - label: "Saturday 1:30 PM"
        date: "2026-05-16"
        time: "1:30 PM"
        colleges:
          - Huckabee College of Architecture
          - School of Professional Studies
          - College of Media & Communication
          - Davis College of Agricultural Sciences & Natural Resources

  # Session options:
  #   roster: true    students come from an imported roster, not from colleges
  #   order: seating  announce only seated students, in seat order
  #   form:           which Microsoft Form this session syncs from. Omit it and
  #                   the session uses the Form named in the environment.
  #                   key scopes response ids, because Forms numbers responses
  #                   from 1 for every form and two forms would collide.
  #                   workbook and folder are matched exactly in OneDrive.
  - name: Fall 2026
    active: true
    sessions:
      # No enroll here on purpose: who walks comes from the Honors College's
      # roster, not from who happened to submit the form.
      - label: "Honors Medallion"
        date: "TBD"
        time: "TBD"
        roster: true
        order: seating
        # An honors ceremony announces a distinction for everyone who walks,
        # so a student missing one gets no clip and is listed, rather than a
        # clip that sounds fine with the distinction quietly left out.
        requires: [major, honors]
        form:
          key: medallion
          workbook: "Ceremoni - Honors Medallion Ceremony Fall 2026.xlsx"
          folder: "Ceremoni - Honors Medallion Ceremony Fall 2026"

      # Where the original Form's submissions live, so the Medallion session
      # holds only real Medallion data. Same shape as the real session on
      # purpose: a demo that behaves differently is not a rehearsal.
      - label: "Demo"
        date: "TBD"
        time: "TBD"
        roster: true
        # enroll: form means syncing puts everyone who submitted onto this
        # roster, so there is no CSV to import. Only the real ceremony takes
        # a roster from the Honors College.
        enroll: form
        order: seating
        form:
          key: form1
          workbook: "Ceremoni - Graduation Name Pronunciation.xlsx"
          folder: "Ceremoni - Graduation Name Pronunciation"
